name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Pushes to main don't run CI here — the Release workflow builds + tests main on merge.

jobs:
  engine:
    name: Engine build + unit tests (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # FFmpeg shared dev libs are not committed; cache them across runs.
      - name: Cache FFmpeg dev libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure (CMake, VS 2022 x64)
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build engine/build --config Release

      - name: Unit tests (ctest)
        run: ctest --test-dir engine/build -C Release --output-on-failure
        # The doctest suite already encodes PCM -> AC3 and checks the IEC 61937 burst,
        # so the engine/encoder path is covered without needing a system ffmpeg here.

      - name: Assemble test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-test | Out-Null
          Copy-Item engine/build/Release/engine.exe dist-test/
          Copy-Item engine/build/Release/*.dll dist-test/
          # engine.exe is built /MD. Ship the exact MSVC runtime beside it so the portable/day-to-day
          # build can start even on a machine without a matching VC++ Redistributable installed.
          Get-ChildItem "$env:WINDIR\System32" -Filter "VCRUNTIME140*.dll" -File |
            Copy-Item -Destination dist-test/
          Get-ChildItem "$env:WINDIR\System32" -Filter "MSVCP140*.dll" -File |
            Copy-Item -Destination dist-test/
          $concrt = Join-Path $env:WINDIR "System32\CONCRT140.dll"
          if (Test-Path $concrt) { Copy-Item $concrt dist-test/ }
          Copy-Item installer/default.conf dist-test/virtual-ac3-encoder.conf
          Copy-Item scripts/install-day-to-day.ps1 dist-test/
          Copy-Item scripts/install-day-to-day.cmd dist-test/INSTALL-DAY-TO-DAY.cmd

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: virtual-ac3-encoder-day-to-day
          path: dist-test
          if-no-files-found: error
