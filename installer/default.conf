# OHL Virtual AC3 Encoder configuration. (Restart the engine after editing.)

# Capture device = the virtual cable's recording endpoint (install VB-CABLE; see QUICKSTART):
in=CABLE Output

# Output: auto-pick the first S/PDIF (optical) output that accepts AC3. To force a specific
# one, comment out the line below and set an exact name from `engine.exe --list`, e.g.:
#   out=Realtek Digital Output
out_spdif=1

bitrate=640000
loopback=0

# Automatic payload mode: real multichannel input -> AC3 5.1. Stereo behavior is selected below.
layout=auto
auto_threshold_db=-60
auto_hold_ms=2000

# Stereo policy:
#   receiver = genuine AC3 2.0; let the AVR run PLII/A.F.D. (safe/current default)
#   music    = experimental OHL Music v0.1 -> discrete AC3 5.1 with phantom center
stereo_processing=receiver

# OHL Music v0.1 tuning. C and LFE are intentionally silent. FL/FR are preserved; the rears
# receive correlation-aware stereo-difference ambience. 0.55 is slightly more enveloping than
# the current PLII Music reference without making the surrounds dominant.
music_surround_gain=0.55

# Listening-position distances in inches. The DSP delays nearer channels to the farthest speaker.
music_distance_fl_in=33
music_distance_fr_in=33
music_distance_c_in=30
music_distance_lfe_in=33
music_distance_sl_in=27
music_distance_sr_in=33

# Fixed-5.1 fallback upmixer only; OHL Music does not use FFmpeg's generic surround filter.
upmix=surround

# Day-to-day notification-area controller (SURROUND / GUITAR / log / exit):
tray=1
