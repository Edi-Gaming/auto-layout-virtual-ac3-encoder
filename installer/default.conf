# OHL Virtual AC3 Encoder configuration. (Restart the engine after editing.)

# Capture device = the virtual cable's recording endpoint (install VB-CABLE; see QUICKSTART):
in=CABLE Output

# Output: auto-pick the first S/PDIF (optical) output that accepts AC3. To force a specific
# one, comment out the line below and set an exact name from `engine.exe --list`, e.g.:
#   out=Realtek Digital Output
out_spdif=1

bitrate=640000
loopback=0

# Automatic payload mode: real multichannel input -> AC3 5.1. Stereo behavior is selected below.
layout=auto
auto_threshold_db=-60
auto_hold_ms=2000

# Stereo policy:
#   receiver = genuine AC3 2.0; let the AVR run PLII/A.F.D. (safe/current default)
#   music    = experimental OHL Music -> discrete AC3 5.1
stereo_processing=receiver

# OHL Music v0.11 tuning. v0.10 recognition now drives a streaming per-bin rear router with
# spectral ownership hysteresis, frequency-dependent steering/front lock, Dimension and Center Width.
music_surround_gain=0.70
music_width_floor=0.16

music_ambience_low_weight=0.08
music_ambience_mid_weight=0.46
music_ambience_high_weight=0.46
music_ambience_attack_ms=100
music_ambience_release_ms=520
music_diffuse_threshold=0.10
music_spectral_intelligence=0.90
music_spatial_bin_threshold=0.30
music_per_bin_routing=0.55
music_spectral_acquire_ms=65
music_spectral_release_ms=520
music_dimension=0.00
music_center_width=1.00

# Per-band rear steering: low <250 Hz, body 250-2k, presence 2-6k, air >6k.
music_steering_low=0.18
music_steering_body=0.55
music_steering_presence=0.90
music_steering_air=1.10

# Per-band front lock multiplier. Lead-vocal/body frequencies are intentionally strongest.
music_front_lock_low=0.30
music_front_lock_body=1.00
music_front_lock_presence=0.82
music_front_lock_air=0.25

music_front_lock=0.88
music_rear_budget=0.22
music_direct_reject=0.78
music_direct_threshold=1.45
music_direct_recovery_ms=18

music_center_treble_gain=0.18
music_center_treble_hz=2400
music_center_lowpass_hz=16000

music_rear_highpass_hz=160
music_rear_lowpass_hz=18000
music_rear_left_trim=1.00
music_rear_right_trim=1.00

# Listening-position distances in inches. The DSP delays nearer channels to the farthest speaker.
music_distance_fl_in=33
music_distance_fr_in=33
music_distance_c_in=30
music_distance_lfe_in=33
music_distance_sl_in=27
music_distance_sr_in=33

# Fixed-5.1 fallback upmixer only; OHL Music does not use FFmpeg's generic surround filter.
upmix=surround

# Day-to-day notification-area controller (SURROUND / GUITAR / log / exit):
tray=1
